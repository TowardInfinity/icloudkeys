<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Checkout with a sign-in link</title>
  <link rel="stylesheet" href="_shared.css">
</head>
<body>
  <main>
    <h1>Guest checkout with "Returning customer? Sign in"</h1>
    <p>The sign-in button makes the page look login-ish; only the address autocomplete tokens say it is checkout. No login offer on the email field.</p>
    <form action="javascript:void(0)">
      <p>Returning customer? <button type="button">Sign in</button></p>
      <label for="ship-name">Full name</label>
      <input type="text" id="ship-name" name="name" autocomplete="shipping name">
      <label for="ship-address">Address</label>
      <input type="text" id="ship-address" name="address" autocomplete="shipping address-line1">
      <label for="ship-postal">Postal code</label>
      <input type="text" id="ship-postal" name="postal" autocomplete="shipping postal-code">
      <label for="email">Email (for receipt)</label>
      <input type="email" id="email" name="email" autocomplete="email">
      <button type="button">Continue to payment</button>
    </form>
  </main>
</body>
</html>
