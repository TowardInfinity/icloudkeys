<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Settings</title>
    <style>
      :root { color-scheme: light dark; font: 13px -apple-system, system-ui, sans-serif; }
      body { margin: 0; padding: 16px; max-width: 520px; }
      label { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; margin-bottom: 14px; cursor: pointer; }
      input { grid-row: span 2; margin: 2px 0 0; }
      .title { font-weight: 600; }
      .detail { opacity: 0.7; }
      .error { color: #d33; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <label>
      <input type="checkbox" id="inPageAutoFill" />
      <span class="title">In-Page AutoFill</span>
      <span class="detail" id="inPageAutoFill-detail"></span>
    </label>
    <label>
      <input type="checkbox" id="keyButton" />
      <span class="title">Key Button in Fields</span>
      <span class="detail">Show a key inside password and user name fields that opens the list.</span>
    </label>
    <label>
      <input type="checkbox" id="browserAutoFillOff" />
      <span class="title">Turn Off Browser AutoFill</span>
      <span class="detail" id="browserAutoFillOff-detail"></span>
    </label>
    <label>
      <input type="checkbox" id="hideBrowserPasskeys" />
      <span class="title">Hide Browser Passkey Suggestions</span>
      <span class="detail" id="hideBrowserPasskeys-detail"></span>
    </label>
    <p class="error" id="error" hidden></p>
    <script type="module" src="./options.ts"></script>
  </body>
</html>
